[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-topxai"
description = "An integration package connecting TopxAI and LangChain"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "TopXEA", email = "support@topxea.com" }]
keywords = ["langchain", "topxai", "llm", "openai-compatible", "claude", "gpt", "grok", "kimi", "deepseek"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

version = "0.1.0"
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.4.7,<2.0.0",
    "langchain-openai>=1.3.1,<2.0.0",
]

[project.urls]
Homepage = "https://ai.topxea.com/docs/use-topxai-with-langchain"
Documentation = "https://ai.topxea.com/docs/use-topxai-with-langchain"
Repository = "https://github.com/UnbelievableT/langchain-topxai"
Issues = "https://github.com/UnbelievableT/langchain-topxai/issues"
Pricing = "https://ai.topxea.com/pricing"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "langchain-tests>=1.1.9,<2.0.0",
]
test_integration = []
lint = ["ruff>=0.13.1,<0.14.0"]
typing = ["mypy>=2.1.0,<2.2.0"]

[tool.hatch.build.targets.sdist]
include = ["langchain_topxai", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
disallow_untyped_defs = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with formatter
    "PLR0913", # Too many arguments
    "ANN401",
    "TC002",
    "TC003",
]
unfixable = ["B028"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "D",      # Test modules and functions are named for what they check
    "S101",   # Tests need assertions
    "SLF001", # Private member access
    "ARG002", # Unused method argument
]
